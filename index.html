<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gaussian Splat Viewer</title>
<style>
  html, body { margin: 0; height: 100%; background: #101014; overflow: hidden; font: 13px/1.5 system-ui, sans-serif; color: #e8e8ee; }
  canvas { display: block; }
  #panel { position: fixed; top: 12px; left: 12px; width: 260px; max-height: calc(100% - 24px); overflow: auto; padding: 10px 12px; background: rgba(20,20,28,.82); border: 1px solid #3a3a48; border-radius: 8px; }
  #panel h1 { margin: 0 0 6px; font-size: 14px; }
  ol { list-style: none; margin: 0 0 8px; padding: 0; }
  li::before { content: "○ "; color: #777; }
  li.run::before { content: "◐ "; color: #f5b84a; }
  li.done::before { content: "● "; color: #5cd68a; }
  li.fail::before { content: "✕ "; color: #ff6b6b; }
  li.fail { color: #ff9a9a; }
  #stats div { display: flex; justify-content: space-between; gap: 8px; }
  #stats span:last-child { color: #fff; font-variant-numeric: tabular-nums; text-align: right; word-break: break-all; }
  button { margin-top: 8px; width: 100%; padding: 6px; background: #2c2c3a; color: #fff; border: 1px solid #4a4a5c; border-radius: 6px; cursor: pointer; }
  button:hover { background: #3a3a4c; }
  #hint { margin-top: 8px; color: #9a9ab0; font-size: 12px; }
  #drop { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(40,80,160,.35); border: 3px dashed #8ab4ff; font-size: 20px; pointer-events: none; }
  body.dragging #drop { display: flex; }
</style>
</head>
<body>
<div id="panel">
  <h1>Gaussian Splat Viewer</h1>
  <ol id="steps">
    <li data-step="lib">라이브러리 불러오기</li>
    <li data-step="renderer">렌더러 넣기</li>
    <li data-step="fetch">파일 받기</li>
    <li data-step="decode">알갱이로 풀기</li>
    <li data-step="bounds">크기 재기</li>
  </ol>
  <div id="stats">
    <div><span>파일</span><span id="s-name">-</span></div>
    <div><span>파일 크기</span><span id="s-size">-</span></div>
    <div><span>받는 시간</span><span id="s-time">-</span></div>
    <div><span>풀기 시간</span><span id="s-decode">-</span></div>
    <div><span>알갱이 개수</span><span id="s-count">-</span></div>
    <div><span>첫 화면까지</span><span id="s-first">-</span></div>
  </div>
  <button id="flip" type="button">위아래 뒤집기</button>
  <div id="hint">.sog .spz .ply(.compressed.ply) 파일을 이 화면에 끌어다 놓으면 바꿔 볼 수 있습니다.</div>
</div>
<div id="drop">파일을 놓으세요</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
    "@sparkjsdev/spark": "https://sparkjs.dev/releases/spark/2.4.0/spark.module.js"
  }
}
</script>

<script type="module">
// ▼ 불러올 파일 이름은 여기서 바꾸세요 (주소 뒤에 ?file=scene.spz 처럼 붙여도 됩니다)
const SPLAT_FILE = new URLSearchParams(location.search).get("file") || "scene.sog";

// 기본 시점: 촬영 첫 프레임의 카메라 위치와 동상(시선 수렴점). 이 장면 전용 값이며
// ?view=auto 를 붙이면 알갱이 분포로 자동 배치하고, ?pos=x,y,z&target=x,y,z 로 직접 지정할 수도 있다.
const DEFAULT_POS = "0,0,0";
const DEFAULT_TARGET = "0.47,-0.16,-10.94";

// 확장자 → Spark 형식 이름 (.compressed.ply 가 .ply 보다 먼저 검사됨)
const FILE_TYPES = [
  [".compressed.ply", "ply"],
  [".sog", "pcsogszip"],
  [".spz", "spz"],
  [".ply", "ply"],
  [".splat", "splat"],
  [".ksplat", "ksplat"],
];
const typeOf = (name) => {
  const n = name.toLowerCase().split("?")[0];
  const hit = FILE_TYPES.find(([ext]) => n.endsWith(ext));
  if (!hit) throw new Error(`지원하지 않는 확장자: ${name}`);
  return hit[1];
};

const $ = (id) => document.getElementById(id);
const setStep = (name, state, note) => {
  const li = document.querySelector(`[data-step="${name}"]`);
  li.className = state;
  if (note !== undefined) li.textContent = li.textContent.split(" · ")[0] + (note ? " · " + note : "");
};
const fmtBytes = (n) => n >= 2 ** 20 ? (n / 2 ** 20).toFixed(1) + " MB" : (n / 1024).toFixed(1) + " KB";
let current = "lib";
const fail = (e) => { console.error(e); setStep(current, "fail", String(e.message || e)); };
const t00 = performance.now();

try {
  setStep("lib", "run");
  const THREE = await import("three");
  const { OrbitControls } = await import("three/addons/controls/OrbitControls.js");
  const { SparkRenderer, SplatMesh, SplatFileType } = await import("@sparkjsdev/spark");
  setStep("lib", "done");

  current = "renderer";
  setStep("renderer", "run");
  const renderer = new THREE.WebGLRenderer({ antialias: false });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  document.body.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.01, 10000);
  camera.position.set(0, 0, 5);
  const spark = new SparkRenderer({ renderer });
  scene.add(spark);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;

  addEventListener("resize", () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });
  let firstFrameCb = null;
  renderer.setAnimationLoop(() => {
    controls.update();
    renderer.render(scene, camera);
    if (firstFrameCb) { const cb = firstFrameCb; firstFrameCb = null; cb(); }
  });
  setStep("renderer", "done");

  let splat = null;
  let flipped = false;
  let center = new THREE.Vector3();

  // 바이트 배열 하나를 풀어서 화면에 올린다 (주소에서 받은 것과 끌어다 놓은 것 공통)
  async function show(fileBytes, name, fetchSec) {
    current = "decode";
    setStep("decode", "run");
    const fileType = typeOf(name);
    const td = performance.now();
    if (splat) { scene.remove(splat); splat.dispose?.(); splat = null; }
    flipped = false;
    const next = new SplatMesh({ fileBytes, fileType: SplatFileType?.[fileType.toUpperCase()] ?? fileType });
    await next.initialized;
    splat = next;
    scene.add(splat);
    const count = splat.numSplats ?? splat.packedSplats?.numSplats ?? 0;
    $("s-count").textContent = count.toLocaleString();
    $("s-decode").textContent = ((performance.now() - td) / 1000).toFixed(2) + " s";
    setStep("decode", "done", fileType);

    current = "bounds";
    setStep("bounds", "run");
    const box = splat.getBoundingBox();
    const size = box.getSize(new THREE.Vector3());
    center = box.getCenter(new THREE.Vector3());
    // 전체 상자는 먼 배경 알갱이까지 포함해 너무 크므로, 카메라 배치는 알갱이 중심의
    // 10~90% 구간(축별)으로 다시 잰다. 실패하면 전체 상자를 그대로 쓴다.
    let fit = { center: center.clone(), radius: Math.max(size.length() / 2, 1e-3) };
    try {
      const xs = [], ys = [], zs = [];
      let i = 0;
      splat.forEachSplat((_, c) => { if (i++ % 16 === 0) { xs.push(c.x); ys.push(c.y); zs.push(c.z); } });
      if (xs.length > 100) {
        const q = (a, p) => { a.sort((u, v) => u - v); return a[Math.floor(p * (a.length - 1))]; };
        const lo = new THREE.Vector3(q(xs, 0.1), q(ys, 0.1), q(zs, 0.1));
        const hi = new THREE.Vector3(q(xs, 0.9), q(ys, 0.9), q(zs, 0.9));
        fit = { center: lo.clone().add(hi).multiplyScalar(0.5), radius: Math.max(hi.clone().sub(lo).length() / 2, 1e-3) };
      }
    } catch (e) { console.warn("trimmed fit failed", e); }
    center = fit.center;
    const params = new URLSearchParams(location.search);
    const zoom = Number(params.get("zoom")) || 1.6;      // 클수록 멀리서 시작
    const elev = params.has("elev") ? Number(params.get("elev")) : 0.15; // 위로 올리는 정도
    const dist = zoom * fit.radius / Math.sin(THREE.MathUtils.degToRad(camera.fov) / 2);
    console.log("fit", JSON.stringify({ c: fit.center.toArray().map((v) => +v.toFixed(2)), r: +fit.radius.toFixed(2), dist: +dist.toFixed(2), full: size.toArray().map((v) => +v.toFixed(1)) }));
    camera.position.copy(center).add(new THREE.Vector3(0, elev, 1).normalize().multiplyScalar(dist));
    camera.near = dist / 1000;
    camera.far = dist * 20;
    camera.updateProjectionMatrix();
    controls.target.copy(center);
    // 시점을 직접 지정: ?pos=x,y,z&target=x,y,z (예: 촬영 첫 프레임 위치)
    const parse3 = (s) => { const a = (s || "").split(",").map(Number); return a.length === 3 && a.every(Number.isFinite) ? new THREE.Vector3(...a) : null; };
    const auto = params.get("view") === "auto";
    const pos = parse3(params.get("pos")) ?? (auto ? null : parse3(DEFAULT_POS));
    const tgt = parse3(params.get("target")) ?? (auto ? null : parse3(DEFAULT_TARGET));
    if (pos && tgt) {
      camera.position.copy(pos); controls.target.copy(tgt);
      camera.near = 0.05; camera.far = 2000; camera.updateProjectionMatrix();
    }
    controls.update();
    setStep("bounds", "done", `${size.x.toFixed(1)}×${size.y.toFixed(1)}×${size.z.toFixed(1)}`);
    $("s-first").textContent = "…";
    firstFrameCb = () => requestAnimationFrame(() => {
      $("s-first").textContent = ((performance.now() - t00) / 1000).toFixed(2) + " s";
      // ?still=1 : 화면 갈무리용. 몇 프레임만 그리고 렌더 루프를 멈춘다.
      if (params.get("still")) setTimeout(() => renderer.setAnimationLoop(null), 1500);
    });
  }

  // 주소에서 받기
  async function loadUrl(url) {
    current = "fetch";
    setStep("fetch", "run");
    $("s-name").textContent = url;
    const t0 = performance.now();
    const res = await fetch(url);
    if (!res.ok) throw new Error(`${url}: HTTP ${res.status}`);
    const total = Number(res.headers.get("content-length")) || 0;
    const reader = res.body.getReader();
    const chunks = []; let got = 0;
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      chunks.push(value); got += value.length;
      setStep("fetch", "run", total ? `${Math.round((got / total) * 100)}%` : fmtBytes(got));
    }
    const bytes = new Uint8Array(got); let off = 0;
    for (const c of chunks) { bytes.set(c, off); off += c.length; }
    const sec = (performance.now() - t0) / 1000;
    $("s-size").textContent = fmtBytes(got);
    $("s-time").textContent = sec.toFixed(2) + " s";
    setStep("fetch", "done");
    await show(bytes, url, sec);
  }

  // 끌어다 놓기 (로컬 파일이라 "받는 시간"은 읽는 시간)
  async function loadFile(file) {
    current = "fetch";
    setStep("fetch", "run");
    $("s-name").textContent = file.name;
    const t0 = performance.now();
    const bytes = new Uint8Array(await file.arrayBuffer());
    $("s-size").textContent = fmtBytes(bytes.length);
    $("s-time").textContent = ((performance.now() - t0) / 1000).toFixed(2) + " s (로컬)";
    setStep("fetch", "done", "로컬");
    await show(bytes, file.name, 0);
  }

  $("flip").addEventListener("click", () => {
    if (!splat) return;
    flipped = !flipped;
    splat.quaternion.setFromAxisAngle(new THREE.Vector3(1, 0, 0), flipped ? Math.PI : 0);
    splat.position.set(0, flipped ? 2 * center.y : 0, flipped ? 2 * center.z : 0);
    splat.updateMatrixWorld(true);
  });

  let depth = 0;
  addEventListener("dragenter", (e) => { e.preventDefault(); depth++; document.body.classList.add("dragging"); });
  addEventListener("dragleave", () => { if (--depth <= 0) { depth = 0; document.body.classList.remove("dragging"); } });
  addEventListener("dragover", (e) => e.preventDefault());
  addEventListener("drop", async (e) => {
    e.preventDefault(); depth = 0; document.body.classList.remove("dragging");
    const f = e.dataTransfer?.files?.[0];
    if (!f) return;
    try { await loadFile(f); } catch (err) { fail(err); }
  });

  await loadUrl(SPLAT_FILE);
} catch (e) {
  fail(e);
}
</script>
</body>
</html>
