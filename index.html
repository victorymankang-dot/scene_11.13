<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gaussian Splat Viewer</title>
<style>
  html, body { margin: 0; height: 100%; background: #101014; overflow: hidden; font: 13px/1.5 system-ui, sans-serif; color: #e8e8ee; }
  canvas { display: block; }
  #panel { position: fixed; top: 12px; left: 12px; width: 260px; padding: 10px 12px; background: rgba(20,20,28,.82); border: 1px solid #3a3a48; border-radius: 8px; }
  #panel h1 { margin: 0 0 6px; font-size: 14px; }
  ol { list-style: none; margin: 0 0 8px; padding: 0; }
  li::before { content: "○ "; color: #777; }
  li.run::before { content: "◐ "; color: #f5b84a; }
  li.done::before { content: "● "; color: #5cd68a; }
  li.fail::before { content: "✕ "; color: #ff6b6b; }
  li.fail { color: #ff9a9a; }
  #stats div { display: flex; justify-content: space-between; }
  #stats span:last-child { color: #fff; font-variant-numeric: tabular-nums; }
  button { margin-top: 8px; width: 100%; padding: 6px; background: #2c2c3a; color: #fff; border: 1px solid #4a4a5c; border-radius: 6px; cursor: pointer; }
  button:hover { background: #3a3a4c; }
</style>
</head>
<body>
<div id="panel">
  <h1>Gaussian Splat Viewer</h1>
  <ol id="steps">
    <li data-step="lib">라이브러리 불러오기</li>
    <li data-step="renderer">렌더러 넣기</li>
    <li data-step="fetch">파일 받기</li>
    <li data-step="decode">알갱이로 풀기</li>
    <li data-step="bounds">크기 재기</li>
  </ol>
  <div id="stats">
    <div><span>파일</span><span id="s-name">-</span></div>
    <div><span>파일 크기</span><span id="s-size">-</span></div>
    <div><span>받는 시간</span><span id="s-time">-</span></div>
    <div><span>알갱이 개수</span><span id="s-count">-</span></div>
  </div>
  <button id="flip" type="button">위아래 뒤집기</button>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
    "@sparkjsdev/spark": "https://sparkjs.dev/releases/spark/2.4.0/spark.module.js"
  }
}
</script>

<script type="module">
// ▼ 불러올 파일 이름은 여기서 바꾸세요
const SPLAT_FILE = "scene.sog";

const $ = (id) => document.getElementById(id);
const setStep = (name, state, note) => {
  const li = document.querySelector(`[data-step="${name}"]`);
  li.className = state;
  if (note) li.textContent = li.textContent.split(" · ")[0] + " · " + note;
};
const fmtBytes = (n) => n >= 2 ** 20 ? (n / 2 ** 20).toFixed(1) + " MB" : (n / 1024).toFixed(1) + " KB";
let current = "lib";
const fail = (e) => { console.error(e); setStep(current, "fail", String(e.message || e)); };

$("s-name").textContent = SPLAT_FILE;

try {
  // 1) 라이브러리
  setStep("lib", "run");
  const THREE = await import("three");
  const { OrbitControls } = await import("three/addons/controls/OrbitControls.js");
  const { SparkRenderer, SplatMesh, SplatFileType } = await import("@sparkjsdev/spark");
  setStep("lib", "done");

  // 2) 렌더러
  current = "renderer";
  setStep("renderer", "run");
  const renderer = new THREE.WebGLRenderer({ antialias: false });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  document.body.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.01, 10000);
  camera.position.set(0, 0, 5);

  const spark = new SparkRenderer({ renderer });
  scene.add(spark);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;

  addEventListener("resize", () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });
  renderer.setAnimationLoop(() => {
    controls.update();
    renderer.render(scene, camera);
  });
  setStep("renderer", "done");

  // 3) 파일 받기 (진행률 표시)
  current = "fetch";
  setStep("fetch", "run");
  const t0 = performance.now();
  const res = await fetch(SPLAT_FILE);
  if (!res.ok) throw new Error(`${SPLAT_FILE}: HTTP ${res.status}`);
  const total = Number(res.headers.get("content-length")) || 0;
  const reader = res.body.getReader();
  const chunks = [];
  let got = 0;
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    chunks.push(value);
    got += value.length;
    setStep("fetch", "run", total ? `${Math.round((got / total) * 100)}%` : fmtBytes(got));
  }
  const fileBytes = new Uint8Array(got);
  let off = 0;
  for (const c of chunks) { fileBytes.set(c, off); off += c.length; }
  const sec = (performance.now() - t0) / 1000;
  $("s-size").textContent = fmtBytes(got);
  $("s-time").textContent = sec.toFixed(2) + " s";
  setStep("fetch", "done");

  // 4) 알갱이로 풀기 (.sog = pcsogszip)
  current = "decode";
  setStep("decode", "run");
  const splat = new SplatMesh({ fileBytes, fileType: SplatFileType?.PCSOGSZIP ?? "pcsogszip" });
  await splat.initialized;
  scene.add(splat);
  const count = splat.numSplats ?? splat.packedSplats?.numSplats ?? 0;
  $("s-count").textContent = count.toLocaleString();
  setStep("decode", "done");

  // 5) 크기 재기 → 카메라 배치
  current = "bounds";
  setStep("bounds", "run");
  const box = splat.getBoundingBox();
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  const radius = Math.max(size.length() / 2, 1e-3);
  const dist = radius / Math.sin(THREE.MathUtils.degToRad(camera.fov) / 2);
  camera.position.copy(center).add(new THREE.Vector3(0, 0, dist));
  camera.near = dist / 1000;
  camera.far = dist * 20;
  camera.updateProjectionMatrix();
  controls.target.copy(center);
  controls.update();
  setStep("bounds", "done", `${size.x.toFixed(1)}×${size.y.toFixed(1)}×${size.z.toFixed(1)}`);

  // 위아래 뒤집기: 중심을 기준으로 X축 180° 회전
  let flipped = false;
  $("flip").addEventListener("click", () => {
    flipped = !flipped;
    splat.quaternion.setFromAxisAngle(new THREE.Vector3(1, 0, 0), flipped ? Math.PI : 0);
    splat.position.set(0, 0, 0);
    if (flipped) splat.position.set(0, 2 * center.y, 2 * center.z);
    splat.updateMatrixWorld(true);
  });
} catch (e) {
  fail(e);
}
</script>
</body>
</html>
